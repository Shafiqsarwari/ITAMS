[asset-inventory]
user = www-data
group = www-data
listen = /run/php/asset-inventory.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

clear_env = yes
env[APP_URL] = https://itams.hopto.org
env[APP_TIMEZONE] = Asia/Kabul
env[AGENT_REGISTRATION_KEY] = change-this-to-a-unique-32-character-key
env[DB_HOST] = 127.0.0.1
env[DB_PORT] = 3306
env[DB_DATABASE] = asset_inventory
env[DB_USERNAME] = asset_inventory_user
env[DB_PASSWORD] = change-this-database-password

php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 16M
php_admin_value[max_execution_time] = 300
php_admin_value[memory_limit] = 256M
